<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>StoryMaker</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0f172a 0%, #4c1d95 50%, #0f172a 100%);
    font-family: 'Segoe UI', system-ui, sans-serif;
    padding: 1.5rem 1rem 3rem;
  }

  .container {
    max-width: 640px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    padding: 1.75rem 0 1.75rem;
  }

  h1 {
    font-size: clamp(2.2rem, 8vw, 3rem);
    font-weight: 800;
    color: #fbbf24;
    letter-spacing: .05em;
  }

  header p {
    color: #c4b5fd;
    font-size: .88rem;
    margin-top: .3rem;
  }

  /* Bouton */
  #btn {
    width: 100%;
    background: linear-gradient(135deg, #f59e0b, #ea580c);
    color: #fff;
    font-size: 1.05rem;
    font-weight: 700;
    padding: 1rem 1.5rem;
    border: none;
    border-radius: .875rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .6rem;
    box-shadow: 0 8px 24px rgba(245,158,11,.35);
    transition: filter .15s, transform .15s, box-shadow .15s;
    margin-bottom: 1.75rem;
  }
  #btn:hover:not(:disabled) {
    filter: brightness(1.12);
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(245,158,11,.5);
  }
  #btn:active:not(:disabled) { filter: brightness(.9); transform: translateY(0); }
  #btn:disabled { opacity: .55; cursor: not-allowed; }
  #btn svg { flex-shrink: 0; }
  .spin { animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Placeholder */
  #placeholder {
    text-align: center;
    color: rgba(196,181,253,.5);
    padding: 3rem 0;
  }
  #placeholder svg { margin: 0 auto 1rem; display: block; opacity: .4; }

  /* Cartes */
  #results { display: flex; flex-direction: column; gap: .85rem; }

  .card {
    border-radius: .875rem;
    padding: 1.2rem 1.35rem;
    border: 2px solid rgba(251,191,36,.2);
    box-shadow: 0 4px 20px rgba(0,0,0,.35);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity .35s ease, transform .35s ease;
  }
  .card.show { opacity: 1; transform: translateY(0); }

  .card-cat {
    font-size: .68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .13em;
    color: #fcd34d;
    margin-bottom: .45rem;
  }
  .card-title {
    font-size: 1.1rem;
    font-weight: 800;
    color: #fff;
    margin-bottom: .4rem;
  }
  .card-desc {
    font-size: .82rem;
    color: #e9d5ff;
    line-height: 1.65;
  }

  /* Couleurs par catégorie */
  .cat-sujet    { background: linear-gradient(135deg, #7f1d1d, #991b1b); }
  .cat-accroche { background: linear-gradient(135deg, #1e3a5f, #1e40af); }
  .cat-action   { background: linear-gradient(135deg, #14532d, #166534); }
  .cat-allies   { background: linear-gradient(135deg, #3b0764, #6b21a8); }
  .cat-menaces  { background: linear-gradient(135deg, #7c2d12, #c2410c); }
  .cat-bonus    { background: linear-gradient(135deg, #713f12, #a16207); }
</style>
</head>
<body>
<div class="container">

  <header>
    <h1>StoryMaker</h1>
    <p>Tirez vos cartes aléatoires</p>
  </header>

  <button id="btn" onclick="generate()">
    <svg id="btn-icon" width="22" height="22" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2.2"
         stroke-linecap="round" stroke-linejoin="round">
      <polyline points="16 3 21 3 21 8"/>
      <line x1="4" y1="20" x2="21" y2="3"/>
      <polyline points="21 16 21 21 16 21"/>
      <line x1="15" y1="15" x2="21" y2="21"/>
    </svg>
    <span id="btn-label">Tirer les cartes</span>
  </button>

  <div id="placeholder">
    <svg width="60" height="60" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.5"
         stroke-linecap="round" stroke-linejoin="round">
      <polyline points="16 3 21 3 21 8"/>
      <line x1="4" y1="20" x2="21" y2="3"/>
      <polyline points="21 16 21 21 16 21"/>
      <line x1="15" y1="15" x2="21" y2="21"/>
    </svg>
    <p>Cliquez sur le bouton pour générer une quête aléatoire</p>
  </div>

  <div id="results"></div>

</div>
<script>

    ["LÉGENDE",     "Une légende locale, des racontars, une rumeur, des on-dit, une prophétie, un récit mythologique, un folklore, une fable, un conte se rapprochant du réel..."],
    ["ÉLU",         "Un porteur malgré lui, un gardien désigné, une personne choisie, un favori, un prophète, une personne clé, un enfant prodigue, un être qui a un rôle à jouer..."],

    ["DÉTAIL",          "Un détail passé inaperçu, une redondance étrange, un indice caché, un petit quelque chose qui diffère de la normale, un élément qui attire l'attention, une petite étrangeté..."],

  ],
  allies: [
    ["PRÊTRE",          "Un prélat, une personne d'église, une personne de foi, un pasteur, un prêcheur, un ecclésiaste, un représentant d'une autre religion, un présumé envoyé des dieux..."],

    ["SHÉRIF",          "Un représentant de la loi, une figure de pouvoir, un gendarme, un agent de l'ordre, un militaire, un porte-parole, un préfet, une personne reconnue..."],
    ["MÉTAMORPHE",      "Une personne changée en animal ou en objet, un messager mystique, un doppelganger, un animal doué de parole, une guide spirituel, un ancêtre..."],
    ["SAVANT",          "Un érudit, une personne de savoir, un scientifique, un magicien, un étudiant, un artiste, un chercheur, un pionnier, un prospecteur, un chercheur de vérité..."],
    ["ESPRIT",          "Un fantôme qui n'a pas trouvé la paix, une entité de jadis, une âme errante, un spectre dictant ses conditions, un mort qui persiste, un être paranormal, d'un autre monde..."],
    ["GENTIL MONSTRE",  "Un monstre pas si méchant, un être allant contre sa condition, un monstre pacifiste, un être en paix avec les races civilisées, un monstre utile à un groupe..."],
    ["TÉMOIN",          "Une victime, un survivant, un prisonnier, une personne sous le choc ou amnésique, un quidam passant par là au bon moment, un œil avisé, une personne sachant des choses..."],
    ["CITOYEN",         "Un groupe de villageois vengeurs, un collectif décidé à agir, une personne désireuse de résoudre le problème, une milice, un groupe de vendetta, des habitants revanchards..."]
  ],
  menaces: [
    ["PARASITE",          "Entité parasitaire, insectoïde, monstres gravitant en essaim, porteurs d'une affliction, monstruosités allant par vague, masses grouillantes, organisme virulent..."],
    ["TRIBU DE CRÉATURES","Groupe tribal, regroupement de petits monstres, kobolds, gobelins, hommes-bêtes, êtres privilégiant le poids du nombre..."],
    ["SECTE",             "Ordre religieux illégal, hérétiques, clan d'apostats, clergé tout-puissant, inquisition, rassemblement de fanatiques, religieux extrêmes, adeptes d'une croyance..."],
    ["MERCENAIRES",       "Autre groupe d'aventuriers concurrents, chasseurs de primes, assassins, tueur à gages, traqueur d'aventuriers, corsaire, limier..."],
    ["BANDITS",           "Groupe de pillards, voleurs, détrousseurs, hors-la-loi, membres d'une mafia, entité du crime, pilleurs de sépulture, contrebandiers, criminels, pirates..."],
    ["TÉNÈBRES",          "Entité des ténèbres, vampire, démon, loup-garou, être voué à la destruction, bête chaotique, monstre des ombres, assermenté à la Nuit, goule, noyeur..."],
    ["ECTOPLASME",        "Fantôme, esprit frappeur ou vengeur, lémure, spectre du passé, djinn farceur, revenant d'une époque révolue, feu-follet, mort-vivant, gardien d'un lieu..."],
    ["NOBLE",             "Noble corrompu, conspirateur, un complotiste, un traître, un usurpateur, un connétable prêt à tout pour parvenir à ses fins, un conglomérat..."],

    ["OPPOSANTS",         "Des militaires d'un pays ennemi, des révolutionnaires, des terroristes, des dissidents, des rebelles, des séparatistes, des partisans dévoués à une cause..."],
    ["CRÉATURE MAGIQUE",  "Monstres liés à la magie, lutin, fée, doppelganger, automate, golem, petits élémentaires, entités faites de magie ou bien conçues par la magie..."],
    ["COLOSSE",           "Un gros monstre, un troll, un dragon, une araignée géante, un ogre, un titan, une entité colossale, un élémentaire, un béhémot, un cyclope, un animal géant..."],
    ["MAGICIEN FOU",      "Un nécromancien, un élémentaliste ayant perdu la raison, un érudit psychopathe, un mage consumé par le pouvoir, un sorcier maudit, un ensorceleur ensorcelé..."]

  bonus: [
    ["UNION",          "Mariage, assemblage, alliance, harmonie, mélange, connexion, lien, unité, fusion, fraternité, coalition, entente, amitié, inimitié naturelle, désunion, haine, amour, séparation..."],

};

const CATEGORIES = [
  { key: "sujet",    label: "Sujet",    cls: "cat-sujet"    },
  { key: "accroche", label: "Accroche", cls: "cat-accroche" },
  { key: "action",   label: "Action",   cls: "cat-action"   },
  { key: "allies",   label: "Alliés",   cls: "cat-allies"   },
  { key: "menaces",  label: "Menaces",  cls: "cat-menaces"  },
  { key: "bonus",    label: "Bonus",    cls: "cat-bonus"    }
];

function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

let busy = false;

function generate() {
  if (busy) return;
  busy = true;

  const btn   = document.getElementById("btn");
  const icon  = document.getElementById("btn-icon");
  const label = document.getElementById("btn-label");

  btn.disabled = true;
  icon.classList.add("spin");
  label.textContent = "Tirage en cours…";

  document.getElementById("placeholder").style.display = "none";
  const container = document.getElementById("results");

  // Fade out les cartes existantes
  container.querySelectorAll(".card").forEach(c => c.classList.remove("show"));

  setTimeout(() => {
    container.innerHTML = "";

    CATEGORIES.forEach(({ key, label: catLabel, cls }, i) => {
      const [titre, description] = rand(DATA[key]);

      const card = document.createElement("div");
      card.className = `card ${cls}`;
      card.innerHTML =
        `<div class="card-cat">${catLabel}</div>` +
        `<div class="card-title">${titre}</div>` +
        `<div class="card-desc">${description}</div>`;

      container.appendChild(card);
      setTimeout(() => card.classList.add("show"), 30 + i * 70);
    });

    icon.classList.remove("spin");
    // Remettre l'icône shuffle
    icon.innerHTML = `
      <polyline points="16 3 21 3 21 8"/>
      <line x1="4" y1="20" x2="21" y2="3"/>
      <polyline points="21 16 21 21 16 21"/>
      <line x1="15" y1="15" x2="21" y2="21"/>`;
    label.textContent = "Tirer les cartes";
    btn.disabled = false;
    busy = false;
  }, 350);
}
</script>
</body>
</html>
