<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CharaMaker</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #1e1b4b 0%, #581c87 50%, #831843 100%);
    font-family: 'Segoe UI', system-ui, sans-serif;
    padding: 1.5rem 1rem 3rem;
  }

  .container {
    max-width: 640px;
    margin: 0 auto;
  }

  /* En-tête */
  header {
    text-align: center;
    padding: 1.5rem 0 1.75rem;
  }

  header h1 {
    font-size: clamp(2rem, 7vw, 2.8rem);
    font-weight: 800;
    color: #fff;
    letter-spacing: .05em;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .5rem;
  }

  header p {
    color: #d8b4fe;
    font-size: .88rem;
    margin-top: .3rem;
  }

  /* Bouton */
  #btn {
    width: 100%;
    background: #fff;
    color: #3b0764;
    font-size: 1.05rem;
    font-weight: 700;
    padding: 1rem 1.5rem;
    border: none;
    border-radius: .875rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .6rem;
    box-shadow: 0 8px 24px rgba(0,0,0,.3);
    transition: background .15s, transform .15s, box-shadow .15s;
    margin-bottom: 1.5rem;
  }
  #btn:hover  { background: #f3e8ff; transform: translateY(-2px); box-shadow: 0 12px 28px rgba(0,0,0,.4); }
  #btn:active { background: #e9d5ff; transform: translateY(0); }

  #btn svg { flex-shrink: 0; }

  /* Placeholder */
  #placeholder {
    text-align: center;
    color: rgba(255,255,255,.5);
    padding: 3rem 0;
  }
  #placeholder svg { margin: 0 auto 1rem; display: block; opacity: .4; }
  #placeholder p { font-size: .95rem; }

  /* Cartes résultat */
  #results { display: flex; flex-direction: column; gap: .85rem; }

  .cat-card {
    background: rgba(255,255,255,.95);
    border-radius: .875rem;
    padding: 1.1rem 1.25rem;
    box-shadow: 0 4px 16px rgba(0,0,0,.2);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity .35s ease, transform .35s ease;
  }
  .cat-card.show { opacity: 1; transform: translateY(0); }

  .cat-name {
    font-size: .7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .12em;
    color: #7c3aed;
    margin-bottom: .5rem;
  }

  .entry-title {
    font-size: 1rem;
    font-weight: 700;
    color: #4c1d95;
    margin-bottom: .3rem;
    border-left: 3px solid #a855f7;
    padding-left: .6rem;
  }

  .entry-desc {
    font-size: .82rem;
    color: #374151;
    line-height: 1.65;
    padding-left: .6rem;
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <h1>
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none"

        <circle cx="12" cy="7" r="4"/>

    </svg>

      <circle cx="12" cy="7" r="4"/>
    </svg>
    <p>Cliquez sur le bouton pour générer votre personnage</p>
  </div>

  <div id="results"></div>

</div>

const CAT_KEYS = Object.keys(CATEGORIES);

function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function randEntry(obj) {
  const keys = Object.keys(obj);
  const k = rand(keys);
  return { title: k, desc: obj[k] };
}

function generate() {
  document.getElementById("placeholder").style.display = "none";
  const container = document.getElementById("results");
  container.innerHTML = "";

  CAT_KEYS.forEach((cat, i) => {
    const { title, desc } = randEntry(CATEGORIES[cat]);

    const card = document.createElement("div");
    card.className = "cat-card";
    card.innerHTML =
      `<div class="cat-name">${cat}</div>` +
      `<div class="entry-title">${title}</div>` +
      `<div class="entry-desc">${desc}</div>`;

    container.appendChild(card);

    // Animation en cascade
    setTimeout(() => card.classList.add("show"), 40 + i * 60);
  });
}
</script>
