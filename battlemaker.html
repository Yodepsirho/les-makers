<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Battlemaker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
  :root {
    --bg:        #15100b;
    --bg-glow:   #2d2013;
    --surface:   #211a12;
    --border:    #4a3921;
    --border-hi: #8a6c33;
    --text:      #f3e8cf;
    --muted:     #c9bb9b;
    --gold:      #e3b955;
    --gold-dim:  #a8873c;
    --hover:     #e3b955;
    --font-display: 'Cinzel', 'Trajan Pro', 'Palatino Linotype', Georgia, serif;
    --font-body:    'Crimson Text', 'Palatino Linotype', Georgia, serif;
  }
  body {
    background:
      radial-gradient(ellipse at 50% -10%, var(--bg-glow) 0%, transparent 60%),
      radial-gradient(ellipse at 50% 120%, #0c0805 0%, transparent 60%),
      var(--bg);
    background-attachment: fixed;
  }
  .card::before, #card::before {
    content: "❖";
    position: absolute; top: .55rem; right: .9rem;
    color: var(--gold-dim); opacity: .55; font-size: .9rem;
  }
  .divider { height: auto; background: none; display: flex; align-items: center; justify-content: center; gap: .6rem; width: 160px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-dim)); }
  .divider::after { background: linear-gradient(270deg, transparent, var(--gold-dim)); }
  .divider span { color: var(--gold); font-size: .7rem; }

  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 1.05rem;
    line-height: 1.5;
  }

  /* Bouton retour */
  .topbar {
    position: sticky; top: 0; z-index: 5;
    padding: .8rem 1.25rem .5rem;
    background: linear-gradient(var(--bg) 55%, transparent);
  }
  .topbar-in { max-width: 680px; margin: 0 auto; }
  .back-btn {
    display: inline-flex; align-items: center; gap: .5rem;
    min-height: 44px; padding: .5rem 1.1rem;
    background: var(--surface);
    color: var(--gold);
    border: 1px solid var(--gold-dim);
    border-radius: .4rem;
    font-family: var(--font-display);
    font-size: .9rem; font-weight: 600;
    letter-spacing: .14em; text-transform: uppercase;
    text-decoration: none;
    transition: background .2s, border-color .2s, color .2s, transform .15s;
  }
  .back-btn:hover { border-color: var(--hover); color: var(--text); transform: translateX(-2px); }
  .back-btn:focus-visible, #btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  .container {
    max-width: 680px; margin: 0 auto;
    padding: 1rem 1.25rem 3rem;
    display: flex; flex-direction: column; align-items: center;
  }

  /* En-tête */
  header { text-align: center; margin-bottom: 2.25rem; width: 100%; }
  .logo { display: inline-block; font-size: 2.4rem; margin-bottom: .6rem; color: var(--gold); opacity: .9; }
  header h1 {
    font-family: var(--font-display);
    font-size: clamp(1.5rem, 6vw, 2.3rem);
    font-weight: 700;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: .7rem;
  }
  .divider { margin: .8rem auto; }
  header p {
    color: var(--muted);
    font-style: italic;
    font-size: 1.1rem;
    letter-spacing: .04em;
  }

  /* Bouton principal */
  #btn {
    width: 100%; max-width: 100%;
    background: var(--surface);
    color: var(--gold);
    border: 1px solid var(--gold-dim);
    border-radius: .5rem;
    padding: 1rem 1.5rem;
    font-family: var(--font-display);
    font-size: 1.05rem; font-weight: 600;
    letter-spacing: .15em; text-transform: uppercase;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: .7rem;
    transition: background .2s, border-color .2s, color .2s, transform .15s, box-shadow .2s;
    margin-bottom: 2rem;
  }
  #btn:hover:not(:disabled) { background: var(--surface); border-color: var(--hover); color: var(--text); transform: translateY(-2px); }
  #btn:active:not(:disabled) { transform: translateY(0); }
  #btn:disabled { opacity: .5; cursor: not-allowed; }
  #btn svg { flex-shrink: 0; }
  .btn-icon { display: inline-flex; }
  .spin { animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Placeholder */
  #placeholder { text-align: center; color: var(--muted); padding: 2.5rem 0; font-size: 1.1rem; font-style: italic; }
  #placeholder svg { margin: 0 auto 1rem; display: block; opacity: .45; color: var(--gold); }

  /* Cartes */
  #results { display: flex; flex-direction: column; gap: 1rem; width: 100%; }

  .card, #card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: .5rem;
    padding: 1.4rem 1.6rem 1.5rem;
    box-shadow: 0 4px 18px rgba(0,0,0,.4), inset 0 0 0 4px var(--surface), inset 0 0 0 5px rgba(255,255,255,.04);
    transition: opacity .35s ease, transform .35s ease, border-color .2s, box-shadow .3s;
  }
  .card { opacity: 0; transform: translateY(10px); }
  .card.show { opacity: 1; transform: translateY(0); }
  .card:hover, #card:hover { border-color: var(--hover); }

  /* Nom de catégorie : grand et lisible */
  .card-cat {
    font-family: var(--font-display);
    font-size: clamp(1.3rem, 5vw, 1.7rem);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .12em;
    color: var(--gold);
    padding-bottom: .5rem;
    margin-bottom: .8rem;
    border-bottom: 1px solid var(--border);
  }
  .card-title {
    font-size: 1.4rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: .4rem;
    letter-spacing: .02em;
  }
  .card-desc { font-size: 1.1rem; color: var(--muted); line-height: 1.6; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
  }
  
  #card {
    width: 100%; min-height: 220px; margin-bottom: 1.5rem;
    display: flex; flex-direction: column; justify-content: center;
    box-shadow: 0 10px 30px rgba(0,0,0,.5), inset 0 0 0 4px var(--surface), inset 0 0 0 5px rgba(255,255,255,.04);
  }
  #card.flash { opacity: .5; }
  #card .empty { color: var(--muted); text-align: center; font-size: 1.15rem; font-style: italic; }
  .badge {
    display: inline-block; width: fit-content;
    padding: .4rem 1.1rem; margin-bottom: 1.1rem;
    border: 1px solid var(--gold-dim); border-radius: .3rem;
    color: var(--gold);
    font-family: var(--font-display);
    font-size: clamp(1.1rem, 4.5vw, 1.35rem); font-weight: 700;
    text-transform: uppercase; letter-spacing: .14em;
  }
  #card-title { font-size: clamp(1.6rem, 6vw, 2rem); font-weight: 600; color: var(--text); line-height: 1.2; margin-bottom: .7rem; letter-spacing: .02em; }
  #card-desc  { color: var(--muted); line-height: 1.65; font-size: 1.12rem; }
  #btn { margin-bottom: 0; }
  #counter { margin-top: 1.2rem; color: var(--muted); font-family: var(--font-display); font-size: .85rem; letter-spacing: .12em; text-transform: uppercase; text-align: center; min-height: 1.2em; }

</style>
</head>
<body>
<div class="topbar"><div class="topbar-in"><a class="back-btn" href="index.html">← Retour</a></div></div>
<div class="container">

  <header>
  <span class="logo">⚔</span>
  <h1>Battlemaker</h1>
  <div class="divider"><span>◆</span></div>
  <p>Tirage de cartes de combat</p>
</header>

<div id="card">
  <p class="empty">Tirez votre première carte pour commencer</p>
</div>

<button id="btn" onclick="draw()">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
       stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
    <polyline points="16 3 21 3 21 8"/>
    <line x1="4" y1="20" x2="21" y2="3"/>
    <polyline points="21 16 21 21 16 21"/>
    <line x1="15" y1="15" x2="21" y2="21"/>
  </svg>
  Tirer une carte
</button>

<p id="counter"></p>
</div>

<script>

    ["Effondrement",    "Effondrement du décor, chute d'éléments imposants, écroulement, destruction du plafond, éboulement, risque de se retrouver coincé ou écrasé, enseveli, broyé."],

    ["Voie",         "Pénombre, visibilité réduite, opacification, sens annulés, caché, dissimulé, invisible, inconnu, effet de surprise, que l'on ne discerne pas au premier abord, peu détectable."],
    ["Magique",      "D'origine mystique, magique, enchantée, surnaturelle, pas de ce monde, paranormale, mystérieuse, occulte, qui dépasse l'entendement, bizarre."],
    ["Dysfonction",  "Défectueux, dont le fonctionnement ou le comportement est erratique, chaotique, inattendu, cassé, endommagé, défaut, troublé, aléatoire, perturbé."],
    ["Infecté",      "Malade, infecté, contagieux, maudit, victime d'une affliction, vénéneux, peut être transmitted, épidémie, effets secondaires, élément pathogène, virus."]
  ]
};

const CATS = Object.keys(CARDS);
const history = [];
let total = 0;

function rand(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function draw() {
  let pool = [...CATS];
  if (history.length >= 2) pool = CATS.filter(c => !history.slice(-2).includes(c));
  else if (history.length === 1) pool = CATS.filter(c => c !== history[0]);

  const cat = rand(pool);
  const [titre, desc] = rand(CARDS[cat]);

  history.push(cat);
  if (history.length > 2) history.shift();
  total++;

  const card = document.getElementById("card");
  card.classList.add("flash");
  setTimeout(() => card.classList.remove("flash"), 150);

  card.innerHTML =
    `<span class="badge">${cat}</span>` +
    `<div id="card-title">${titre}</div>` +
    `<div id="card-desc">${desc}</div>`;

  document.getElementById("counter").textContent =
    total === 1 ? "1 carte tirée" : `${total} cartes tirées`;
}
</script>
</body>
</html>
