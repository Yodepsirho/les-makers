<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Horreur Story Maker</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0d0d0d;
    --surface:   #141414;
    --border:    #2a2a2a;
    --border-hi: #3d3d3d;
    --text:      #e8e8e8;
    --muted:     #888;
    --gold:      #b8962e;
    --gold-dim:  #7a621e;
  }

  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    padding: 2.5rem 1.5rem 3rem;
  }

  .container {
    max-width: 680px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* En-tête */
  header { text-align: center; margin-bottom: 2.5rem; width: 100%; }

  .logo {
    display: inline-block;
    font-size: 2rem;
    margin-bottom: 0.8rem;
    color: var(--gold);
    opacity: .8;
  }

  header h1 {
    font-size: clamp(1.4rem, 5vw, 2rem);
    font-weight: 300;
    letter-spacing: .35em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: .6rem;
  }

  .divider {
    width: 40px;
    height: 1px;
    background: var(--gold-dim);
    margin: .8rem auto;
  }

  header p {
    color: var(--muted);
    font-size: .8rem;
    letter-spacing: .15em;
    text-transform: uppercase;
  }

  /* Bouton */
  #btn {
    width: 100%;
    background: var(--surface);
    color: var(--gold);
    border: 1px solid var(--gold-dim);
    border-radius: .5rem;
    padding: 1rem 1.5rem;
    font-size: .95rem;
    font-weight: 600;
    letter-spacing: .15em;
    text-transform: uppercase;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .6rem;
    transition: background .2s, border-color .2s, color .2s, transform .15s;
    margin-bottom: 2rem;
  }
  #btn:hover:not(:disabled) {
    background: #1a1a1a;
    border-color: var(--gold);
    color: #fff;
    transform: translateY(-2px);
  }
  #btn:active:not(:disabled) { transform: translateY(0); }
  #btn:disabled { opacity: .5; cursor: not-allowed; }

  .btn-icon { display: inline-flex; }
  .spin { animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Placeholder */
  #placeholder {
    text-align: center;
    color: var(--muted);
    padding: 3rem 0;
    font-size: .88rem;
    letter-spacing: .05em;
  }

  /* Cartes */
  #results { display: flex; flex-direction: column; gap: .85rem; width: 100%; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: .5rem;
    padding: 1.25rem 1.5rem;
    box-shadow: 0 4px 16px rgba(0,0,0,.3);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity .35s ease, transform .35s ease, border-color .2s;
  }
  .card.show { opacity: 1; transform: translateY(0); }
  .card:hover { border-color: var(--border-hi); }

  .card-cat {
    font-size: 1.5rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .15em;
    color: var(--gold-dim);
    margin-bottom: .4rem;
  }

  .card-title {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--gold);
    margin-bottom: .4rem;
    letter-spacing: .02em;
  }

  .card-desc {
    font-size: 1rem;
    color: var(--muted);
    line-height: 1.65;
  }

  /* Nav retour */
  .back-link {
    margin-top: 2.5rem;
    color: var(--muted);
    text-decoration: none;
    font-size: .78rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    transition: color .2s;
  }
  .back-link:hover { color: var(--gold); }
</style>
</head>
<body>
<div class="container">

  <header>
    <span class="logo">☽</span>
    <h1>Horreur Story Maker</h1>
    <div class="divider"></div>
    <p>Générateur de cauchemars</p>
  </header>

  <button id="btn" onclick="generate()">
    <span class="btn-icon" id="btn-icon">

           stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="16 3 21 3 21 8"/>
        <line x1="4" y1="20" x2="21" y2="3"/>
        <polyline points="21 16 21 21 16 21"/>
        <line x1="15" y1="15" x2="21" y2="21"/>
      </svg>
    </span>
    <span id="btn-label">Générer une histoire</span>
  </button>

  <div id="placeholder">
    Cliquez sur le bouton pour invoquer une histoire terrifiante...
  </div>

  <div id="results"></div>

  <a class="back-link" href="index.html">← Retour aux outils</a>

</div>

const CATEGORIES = [
  { key: "sujet",    label: "Sujet"    },
  { key: "accroche", label: "Accroche" },
  { key: "action",   label: "Action"   },
  { key: "allies",   label: "Alliés"   },
  { key: "menaces",  label: "Menaces"  },
  { key: "bonus",    label: "Bonus"    }
];

function rand(obj) {
  const keys = Object.keys(obj);
  const k = keys[Math.floor(Math.random() * keys.length)];
  return { titre: k, desc: obj[k] };
}

let busy = false;

function generate() {
  if (busy) return;
  busy = true;

  const btn   = document.getElementById("btn");
  const icon  = document.getElementById("btn-icon");
  const label = document.getElementById("btn-label");

  btn.disabled = true;
  icon.classList.add("spin");
  label.textContent = "Invocation…";

  document.getElementById("placeholder").style.display = "none";
  const container = document.getElementById("results");
  container.querySelectorAll(".card").forEach(c => c.classList.remove("show"));

  setTimeout(() => {
    container.innerHTML = "";

    CATEGORIES.forEach(({ key, label: catLabel }, i) => {
      const { titre, desc } = rand(DATA[key]);

      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML =
        `<div class="card-cat">${catLabel}</div>` +
        `<div class="card-title">${titre}</div>` +
        `<div class="card-desc">${desc}</div>`;

      container.appendChild(card);
      setTimeout(() => card.classList.add("show"), 40 + i * 80);
    });

    icon.classList.remove("spin");
    label.textContent = "Générer une histoire";
    btn.disabled = false;
    busy = false;
  }, 400);
}
</script>
</body>
</html>
