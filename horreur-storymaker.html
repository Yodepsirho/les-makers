<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Horreur Story Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
  :root {
    --bg:        #060908;
    --bg-glow:   #0f2420;
    --surface:   #0c1311;
    --border:    #1f322c;
    --border-hi: #3f6556;
    --text:      #e1ebe5;
    --muted:     #a7bbb0;
    --gold:      #86cfa8;   /* vert nécrotique */
    --gold-dim:  #4f8068;
    --hover:     #a3283a;   /* rouge sang */
    --font-display: 'IM Fell English SC', 'Palatino Linotype', Georgia, serif;
    --font-body:    'Crimson Text', 'IM Fell English', Georgia, serif;
  }
  body {
    background:
      radial-gradient(ellipse at 50% -10%, var(--bg-glow) 0%, transparent 65%),
      radial-gradient(ellipse at 50% 130%, #1a0508 0%, transparent 55%),
      var(--bg);
    background-attachment: fixed;
  }
  /* Brume qui dérive */
  body::before, body::after {
    content: ""; position: fixed; inset: -20%; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse 40% 30% at 30% 40%, rgba(110,190,160,.07), transparent 70%),
                radial-gradient(ellipse 35% 25% at 70% 65%, rgba(90,160,140,.06), transparent 70%);
    animation: fog 38s ease-in-out infinite alternate;
  }
  body::after { animation-duration: 55s; animation-direction: alternate-reverse; opacity: .8; }
  @keyframes fog { from { transform: translate3d(-4%, -2%, 0) scale(1); } to { transform: translate3d(5%, 3%, 0) scale(1.15); } }
  .container, .topbar { position: relative; z-index: 1; }
  .topbar { position: sticky; z-index: 5; }

  header h1 { animation: flicker 7s infinite; text-shadow: 0 0 18px rgba(134,207,168,.35); }
  @keyframes flicker { 0%, 92%, 96%, 100% { opacity: 1; } 93% { opacity: .55; } 94% { opacity: .95; } 95% { opacity: .4; } }
  .logo { text-shadow: 0 0 14px rgba(134,207,168,.6); }

  .divider { height: auto; background: none; display: flex; align-items: center; justify-content: center; gap: .6rem; width: 160px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-dim)); }
  .divider::after { background: linear-gradient(270deg, transparent, var(--gold-dim)); }
  .divider span { color: var(--hover); font-size: .6rem; }  /* l'œil */

  .card, #card { border-left: 3px solid var(--border-hi); }
  .card:hover, #card:hover { border-left-color: var(--hover); box-shadow: 0 6px 24px rgba(0,0,0,.6), -6px 0 20px -8px rgba(163,40,58,.45); }
  #btn:hover:not(:disabled) { box-shadow: 0 0 18px rgba(163,40,58,.35); }

  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 1.05rem;
    line-height: 1.5;
  }

  /* Bouton retour */
  .topbar {
    position: sticky; top: 0; z-index: 5;
    padding: .8rem 1.25rem .5rem;
    background: linear-gradient(var(--bg) 55%, transparent);
  }
  .topbar-in { max-width: 680px; margin: 0 auto; }
  .back-btn {
    display: inline-flex; align-items: center; gap: .5rem;
    min-height: 44px; padding: .5rem 1.1rem;
    background: var(--surface);
    color: var(--gold);
    border: 1px solid var(--gold-dim);
    border-radius: .4rem;
    font-family: var(--font-display);
    font-size: .9rem; font-weight: 600;
    letter-spacing: .14em; text-transform: uppercase;
    text-decoration: none;
    transition: background .2s, border-color .2s, color .2s, transform .15s;
  }
  .back-btn:hover { border-color: var(--hover); color: var(--text); transform: translateX(-2px); }
  .back-btn:focus-visible, #btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  .container {
    max-width: 680px; margin: 0 auto;
    padding: 1rem 1.25rem 3rem;
    display: flex; flex-direction: column; align-items: center;
  }

  /* En-tête */
  header { text-align: center; margin-bottom: 2.25rem; width: 100%; }
  .logo { display: inline-block; font-size: 2.4rem; margin-bottom: .6rem; color: var(--gold); opacity: .9; }
  header h1 {
    font-family: var(--font-display);
    font-size: clamp(1.5rem, 6vw, 2.3rem);
    font-weight: 700;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: .7rem;
  }
  .divider { margin: .8rem auto; }
  header p {
    color: var(--muted);
    font-style: italic;
    font-size: 1.1rem;
    letter-spacing: .04em;
  }

  /* Bouton principal */
  #btn {
    width: 100%; max-width: 100%;
    background: var(--surface);
    color: var(--gold);
    border: 1px solid var(--gold-dim);
    border-radius: .5rem;
    padding: 1rem 1.5rem;
    font-family: var(--font-display);
    font-size: 1.05rem; font-weight: 600;
    letter-spacing: .15em; text-transform: uppercase;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: .7rem;
    transition: background .2s, border-color .2s, color .2s, transform .15s, box-shadow .2s;
    margin-bottom: 2rem;
  }
  #btn:hover:not(:disabled) { background: var(--surface); border-color: var(--hover); color: var(--text); transform: translateY(-2px); }
  #btn:active:not(:disabled) { transform: translateY(0); }
  #btn:disabled { opacity: .5; cursor: not-allowed; }
  #btn svg { flex-shrink: 0; }
  .btn-icon { display: inline-flex; }
  .spin { animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Placeholder */
  #placeholder { text-align: center; color: var(--muted); padding: 2.5rem 0; font-size: 1.1rem; font-style: italic; }
  #placeholder svg { margin: 0 auto 1rem; display: block; opacity: .45; color: var(--gold); }

  /* Cartes */
  #results { display: flex; flex-direction: column; gap: 1rem; width: 100%; }

  .card, #card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: .5rem;
    padding: 1.4rem 1.6rem 1.5rem;
    box-shadow: 0 4px 18px rgba(0,0,0,.4), inset 0 0 0 4px var(--surface), inset 0 0 0 5px rgba(255,255,255,.04);
    transition: opacity .35s ease, transform .35s ease, border-color .2s, box-shadow .3s;
  }
  .card { opacity: 0; transform: translateY(10px); }
  .card.show { opacity: 1; transform: translateY(0); }
  .card:hover, #card:hover { border-color: var(--hover); }

  /* Nom de catégorie : grand et lisible */
  .card-cat {
    font-family: var(--font-display);
    font-size: clamp(1.3rem, 5vw, 1.7rem);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .12em;
    color: var(--gold);
    padding-bottom: .5rem;
    margin-bottom: .8rem;
    border-bottom: 1px solid var(--border);
  }
  .card-title {
    font-size: 1.4rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: .4rem;
    letter-spacing: .02em;
  }
  .card-desc { font-size: 1.1rem; color: var(--muted); line-height: 1.6; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
  }
  
</style>
</head>
<body>
<div class="topbar"><div class="topbar-in"><a class="back-btn" href="index.html">← Retour</a></div></div>
<div class="container">

  <header>
    <span class="logo">☽</span>
    <h1>Horreur Story Maker</h1>
    <div class="divider"><span>◉</span></div>
    <p>Générateur de cauchemars</p>
  </header>

  <button id="btn" onclick="generate()">
    <span class="btn-icon" id="btn-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="16 3 21 3 21 8"/>
        <line x1="4" y1="20" x2="21" y2="3"/>
        <polyline points="21 16 21 21 16 21"/>
        <line x1="15" y1="15" x2="21" y2="21"/>
      </svg>
    </span>
    <span id="btn-label">Générer une histoire</span>
  </button>

  <div id="placeholder">
    Cliquez sur le bouton pour invoquer une histoire terrifiante...
  </div>

  <div id="results"></div>
</div>

const CATEGORIES = [
  { key: "sujet",    label: "Sujet"    },
  { key: "accroche", label: "Accroche" },
  { key: "action",   label: "Action"   },
  { key: "allies",   label: "Alliés"   },
  { key: "menaces",  label: "Menaces"  },
  { key: "bonus",    label: "Bonus"    }
];

function rand(obj) {
  const keys = Object.keys(obj);
  const k = keys[Math.floor(Math.random() * keys.length)];
  return { titre: k, desc: obj[k] };
}

let busy = false;

function generate() {
  if (busy) return;
  busy = true;

  const btn   = document.getElementById("btn");
  const icon  = document.getElementById("btn-icon");
  const label = document.getElementById("btn-label");

  btn.disabled = true;
  icon.classList.add("spin");
  label.textContent = "Invocation…";

  document.getElementById("placeholder").style.display = "none";
  const container = document.getElementById("results");
  container.querySelectorAll(".card").forEach(c => c.classList.remove("show"));

  setTimeout(() => {
    container.innerHTML = "";

    CATEGORIES.forEach(({ key, label: catLabel }, i) => {
      const { titre, desc } = rand(DATA[key]);

      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML =
        `<div class="card-cat">${catLabel}</div>` +
        `<div class="card-title">${titre}</div>` +
        `<div class="card-desc">${desc}</div>`;

      container.appendChild(card);
      setTimeout(() => card.classList.add("show"), 40 + i * 80);
    });

    icon.classList.remove("spin");
    label.textContent = "Générer une histoire";
    btn.disabled = false;
    busy = false;
  }, 400);
}
</script>
